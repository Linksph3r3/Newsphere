<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newsphere</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Newsphere</h1>
    <p>Keeping you up to date with the latest news</p>
  </header>

  <main>
    <section class="news-section">
      <h2><i class="fas fa-globe"></i> Global News</h2>
      <div class="news-container" id="globalNews"></div>
    </section>

    <section class="news-section">
      <h2><i class="fas fa-film"></i> Entertainment</h2>
      <div class="news-container" id="entertainmentNews"></div>
    </section>

    <section class="news-section">
    <h2><i class="fas fa-futbol"></i> Sports</h2>
      <div class="news-container" id="sportsNews"></div>
    </section>
    <p id="lastUpdated" style="text-align:center; margin:2rem 0; color:#777;"></p>
  </main>

    <footer>
    <p>Newsphere 2025 | Powered by GNews API</p>
  </footer>

  <!-- Font Awesome (for minimalist icons) -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  
  <!-- ✅ Load your JS file -->
 <script src="js/script.js"></script>

</body>
</html>
