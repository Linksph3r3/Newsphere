<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News Bulletin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>📰 Daily News Bulletin</h1>
    <p>Auto-updated world, entertainment & sports headlines</p>
  </header>

  <main>
    <section class="news-section">
      <h2>🌍 Global News</h2>
      <div class="news-container" id="globalNews"></div>
    </section>

    <div class="ad-banner">Advertisement</div>

    <section class="news-section">
      <h2>🎬 Entertainment</h2>
      <div class="news-container" id="entertainmentNews"></div>
    </section>

    <div class="ad-banner">Advertisement</div>

    <section class="news-section">
      <h2>⚽ Sports</h2>
      <div class="news-container" id="sportsNews"></div>
    </section>

    
    <div class="ad-banner">Advertisement</div>

    <p id="lastUpdated" style="text-align:center; margin:2rem 0; color:#aaa;"></p>
  </main>

  <footer>
    <p>© 2025 News Bulletin | Powered by GNews API</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
